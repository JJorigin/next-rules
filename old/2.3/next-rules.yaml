# Next-Rules 2.3 · 3X-UI 远程路由
# 在面板中启用路由并填写此文件地址，客户端使用面板生成的完整订阅。
# 面板须允许远程 DNS 配置；TUN 和 IPv6 开关由客户端管理。
dns:
  enable: true
  enhanced-mode: "fake-ip"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-range6: "fdfe:dcba:9876::1/64"
  fake-ip-filter-mode: "blacklist"
  fake-ip-filter: ["+.lan","+.local","+.arpa","time.*.com","ntp.*.com","+.pool.ntp.org","+.market.xiaomi.com","localhost.ptlogin2.qq.com","*.msftncsi.com","www.msftconnecttest.com"]
  ipv6: true
  prefer-h3: false
  respect-rules: false
  default-nameserver: ["223.5.5.5","119.29.29.29"]
  proxy-server-nameserver: ["https://dns.alidns.com/dns-query#DIRECT","https://doh.pub/dns-query#DIRECT"]
  proxy-server-nameserver-policy: {}
  direct-nameserver: ["https://dns.alidns.com/dns-query#DIRECT","https://doh.pub/dns-query#DIRECT"]
  direct-nameserver-follow-policy: true
  nameserver-policy:
    "geosite:private": ["system"]
    "rule-set:next-rules-v2-dns-00": ["https://1.1.1.1/dns-query#%F0%9F%9A%80%20%E9%BB%98%E8%AE%A4%E4%BB%A3%E7%90%86%20%5B%E8%87%AA%E9%80%89%5D","https://8.8.8.8/dns-query#%F0%9F%9A%80%20%E9%BB%98%E8%AE%A4%E4%BB%A3%E7%90%86%20%5B%E8%87%AA%E9%80%89%5D"]
