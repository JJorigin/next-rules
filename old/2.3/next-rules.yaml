proxy-groups:
  - name: "🚀 默认代理 [自选]"
    type: "select"
    default-selected: "♻️ 自动选择 [系统]"
    empty-fallback: "REJECT"
    exclude-filter: "(?i)(?:^|[|｜]|\\[海外\\])[^A-Za-z0-9\\u3400-\\u9FFF]*(?:官网(?:地址|网址)?|官方(?:网站|网址|频道|群组|交流群)|流量(?:剩余|已用|总量|重置)?|剩余(?:流量)?|可用流量|已用流量|总流量|到期(?:时间|日期)?|过期(?:时间|日期)?|有效期|套餐(?:信息|名称|到期)?|订阅(?:信息|地址|链接|更新)?|(?:下次)?重置(?:时间|日期)?|traffic|remaining(?:[ _-]+traffic)?|expire[sd]?|expiry|quota|bandwidth|subscription|reset|official[ _-]+(?:website|site|channel)|website)(?=$|[\\s:：=|｜0-9-])"
    include-all: true
    exclude-type: "Direct|Pass|Compatible|Dns|Reject|RejectDrop"
    proxies: ["♻️ 自动选择 [系统]"]
  - name: "🤖 AI服务 [自选]"
    type: "select"
    default-selected: "♻️ 自动选择 [系统]"
    empty-fallback: "REJECT"
    exclude-filter: "(?i)(?:^|[|｜]|\\[海外\\])[^A-Za-z0-9\\u3400-\\u9FFF]*(?:官网(?:地址|网址)?|官方(?:网站|网址|频道|群组|交流群)|流量(?:剩余|已用|总量|重置)?|剩余(?:流量)?|可用流量|已用流量|总流量|到期(?:时间|日期)?|过期(?:时间|日期)?|有效期|套餐(?:信息|名称|到期)?|订阅(?:信息|地址|链接|更新)?|(?:下次)?重置(?:时间|日期)?|traffic|remaining(?:[ _-]+traffic)?|expire[sd]?|expiry|quota|bandwidth|subscription|reset|official[ _-]+(?:website|site|channel)|website)(?=$|[\\s:：=|｜0-9-])"
    include-all: true
    exclude-type: "Pass|Compatible|Dns|Reject|RejectDrop"
    proxies: ["♻️ 自动选择 [系统]","DIRECT"]
  - name: "🔍 谷歌服务 [自选]"
    type: "select"
