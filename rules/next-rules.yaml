# Next-Rules 1.1
# 供 3X-UI「订阅设置 → Clash / Mihomo → 全局路由规则」使用。
# 本文件不创建国家/地区策略组，也不修改 DNS、TUN、IPv6、Sniffer、Hosts、端口或运行模式。

rule-providers:
  next-rules-ads:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/n0de-sudo/Perfect-Rules@main/Clash/rules/ads.yaml
    path: ./providers/next-rules-ads.yaml
    interval: 86400
  next-rules-ai:
