rules:
  # 专用策略若无法转发 UDP，拒绝该请求，避免继续匹配到其他出口。
  - "RULE-SET,next-rules-software,🖥️ 软件分流 [自选]"
  - "AND,((NETWORK,UDP),(RULE-SET,next-rules-software)),REJECT"
  - "GEOSITE,private,DIRECT"
  - "GEOIP,private,DIRECT,no-resolve"
  - "RULE-SET,next-rules-ads,🛑 广告拦截 [系统]"
  # 专用服务按以下顺序匹配，AI 优先于 Google/YouTube；未命中时继续匹配后续规则。
  - "RULE-SET,next-rules-ai,🤖 AI服务 [自选]"
  - "AND,((NETWORK,UDP),(RULE-SET,next-rules-ai)),REJECT"
  - "RULE-SET,next-rules-youtube,🔍 谷歌服务(含油管) [自选]"
  - "AND,((NETWORK,UDP),(RULE-SET,next-rules-youtube)),REJECT"
  - "RULE-SET,next-rules-google,🔍 谷歌服务(含油管) [自选]"
  - "AND,((NETWORK,UDP),(RULE-SET,next-rules-google)),REJECT"
  - "RULE-SET,next-rules-crypto,💰 币圈专用 [自选]"
  - "AND,((NETWORK,UDP),(RULE-SET,next-rules-crypto)),REJECT"
  - "RULE-SET,next-rules-disney,🎬 流媒体 [自选]"
  - "AND,((NETWORK,UDP),(RULE-SET,next-rules-disney)),REJECT"
  - "GEOSITE,netflix,🎬 流媒体 [自选]"
  - "AND,((NETWORK,UDP),(GEOSITE,netflix)),REJECT"
  - "RULE-SET,next-rules-apple,🍎 苹果服务 [自选]"
  - "AND,((NETWORK,UDP),(RULE-SET,next-rules-apple)),REJECT"
  - "GEOSITE,telegram,💬 电报专用 [自选]"
  - "AND,((NETWORK,UDP),(GEOSITE,telegram)),REJECT"
  - "RULE-SET,next-rules-telegram-ip,💬 电报专用 [自选],no-resolve"
  - "AND,((NETWORK,UDP),(RULE-SET,next-rules-telegram-ip,no-resolve)),REJECT"
  - "GEOSITE,microsoft,Ⓜ️ 微软服务 [自选]"
  - "AND,((NETWORK,UDP),(GEOSITE,microsoft)),REJECT"
  # 命中直连规则且未命中特定规则的普通流量直连。
  - "GEOSITE,CN,DIRECT"
  - "GEOIP,CN,DIRECT,no-resolve"
  # 未匹配的 UDP 先尝试默认代理，无法转发时拒绝。
  - "NETWORK,UDP,🚀 默认代理 [自选]"
  - "NETWORK,UDP,REJECT"
  - "MATCH,🚀 默认代理 [自选]"
