# Next-Rules 1.0
# 供 3X-UI「订阅设置 → Clash / Mihomo → 全局路由规则」使用。
# 本文件只提供策略组、规则提供者和分流规则，不修改 DNS、TUN、IPv6、Sniffer、Hosts、端口或运行模式。

rule-providers:
  next-rules-ads:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/n0de-sudo/Perfect-Rules@main/Clash/rules/ads.yaml
