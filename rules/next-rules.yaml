    proxies: ["♻️ 自动选择 [系统]", "🇺🇸 美国节点 [系统]", "🇲🇾 马来西亚节点 [系统]", "🇭🇰 香港节点 [系统]", "🇯🇵 日本节点 [系统]", "🇸🇬 新加坡节点 [系统]", "🇩🇪 德国节点 [系统]", "🌍 其他地区 [系统]", "🌐 全部节点 [系统]", "直连(DIRECT)"]
  - name: "🤖 AI服务 [自选]"
    type: select
    proxies: ["♻️ 自动选择 [系统]", "🇺🇸 美国节点 [系统]", "🇲🇾 马来西亚节点 [系统]", "🇭🇰 香港节点 [系统]", "🇯🇵 日本节点 [系统]", "🇸🇬 新加坡节点 [系统]", "🇩🇪 德国节点 [系统]", "🌍 其他地区 [系统]", "🌐 全部节点 [系统]", "直连(DIRECT)"]
  - name: "🔍 谷歌服务(含油管) [自选]"
