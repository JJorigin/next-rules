# Next-Rules 1.3
# 供 3X-UI「订阅设置 → Clash / Mihomo → 全局路由规则」使用。
# 节点由订阅提供；DNS、TUN、IPv6、Sniffer、Hosts、端口和运行模式由客户端或原订阅管理。

rule-providers:
  next-rules-ads:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/n0de-sudo/Perfect-Rules@main/Clash/rules/ads.yaml
    path: ./providers/next-rules-ads.yaml
    interval: 86400
