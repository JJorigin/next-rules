proxy-groups:
  # ---------- 用户默认组 ----------
  # 未命中特定规则的请求默认使用代理；自动选择和当前订阅中的有效节点可手动选择。
  - name: "🚀 默认代理 [自选]"
    type: select
    proxies: ["♻️ 自动选择 [系统]"]
    include-all-proxies: true
    exclude-type: Direct
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website|^DIRECT$"

  # ---------- 用户场景组 ----------
  # 场景组直接展开当前订阅中的有效代理节点。
  # include-all-proxies 不包含其他策略组；DIRECT 是 Mihomo 内置直连出口。
  - name: "🤖 AI服务 [自选]"
    type: select
    proxies: ["♻️ 自动选择 [系统]", DIRECT]
    include-all-proxies: true
    exclude-type: Direct
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website|^DIRECT$"
  - name: "🔍 谷歌服务(含油管) [自选]"
    type: select
    proxies: ["♻️ 自动选择 [系统]", DIRECT]
    include-all-proxies: true
    exclude-type: Direct
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website|^DIRECT$"
  - name: "🎬 流媒体 [自选]"
    type: select
    proxies: ["♻️ 自动选择 [系统]", DIRECT]
    include-all-proxies: true
    exclude-type: Direct
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website|^DIRECT$"
  - name: "💬 电报专用 [自选]"
    type: select
    proxies: ["♻️ 自动选择 [系统]", DIRECT]
    include-all-proxies: true
    exclude-type: Direct
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website|^DIRECT$"
  - name: "Ⓜ️ 微软服务 [自选]"
    type: select
    proxies: ["♻️ 自动选择 [系统]", DIRECT]
    include-all-proxies: true
    exclude-type: Direct
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website|^DIRECT$"
  - name: "🍎 苹果服务 [自选]"
    type: select
    proxies: ["♻️ 自动选择 [系统]", DIRECT]
    include-all-proxies: true
    exclude-type: Direct
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website|^DIRECT$"
  - name: "💰 币圈专用 [自选]"
    type: select
    proxies: ["♻️ 自动选择 [系统]", DIRECT]
    include-all-proxies: true
    exclude-type: Direct
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website|^DIRECT$"
  - name: "🖥️ 软件分流 [自选]"
    type: select
    proxies: ["♻️ 自动选择 [系统]", DIRECT]
    include-all-proxies: true
    exclude-type: Direct
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website|^DIRECT$"

  # ---------- 系统组 ----------
  - name: "♻️ 自动选择 [系统]"
    type: url-test
    include-all-proxies: true
    exclude-type: Direct
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website|^DIRECT$"
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  # ---------- 广告拦截 ----------
  - name: "🛑 广告拦截 [系统]"
    type: select
    proxies: [REJECT, DIRECT]

rules:
  - "RULE-SET,next-rules-software,🖥️ 软件分流 [自选]"
  - "GEOSITE,private,DIRECT"
  - "GEOIP,private,DIRECT,no-resolve"
  - "RULE-SET,next-rules-ads,🛑 广告拦截 [系统]"
  # AI 规则必须在直连规则之前，避免专用服务被直连规则提前截断。
  - "RULE-SET,next-rules-ai,🤖 AI服务 [自选]"
  - "RULE-SET,next-rules-youtube,🔍 谷歌服务(含油管) [自选]"
  - "RULE-SET,next-rules-google,🔍 谷歌服务(含油管) [自选]"
  - "RULE-SET,next-rules-crypto,💰 币圈专用 [自选]"
  - "RULE-SET,next-rules-disney,🎬 流媒体 [自选]"
  - "GEOSITE,netflix,🎬 流媒体 [自选]"
  - "RULE-SET,next-rules-apple,🍎 苹果服务 [自选]"
  - "GEOSITE,telegram,💬 电报专用 [自选]"
  - "GEOSITE,microsoft,Ⓜ️ 微软服务 [自选]"
  # 命中直连规则且未命中特定规则的普通流量直连。
  - "GEOSITE,CN,DIRECT"
  - "GEOIP,CN,DIRECT,no-resolve"
  - "MATCH,🚀 默认代理 [自选]"

