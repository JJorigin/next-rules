  - name: "🎬 流媒体 [自选]"
    type: select
    proxies: ["♻️ 自动选择 [系统]", "🇺🇸 美国节点 [系统]", "🇲🇾 马来西亚节点 [系统]", "🇭🇰 香港节点 [系统]", "🇯🇵 日本节点 [系统]", "🇸🇬 新加坡节点 [系统]", "🇩🇪 德国节点 [系统]", "🌍 其他地区 [系统]", "🌐 全部节点 [系统]", "直连(DIRECT)"]
  - name: "💬 电报专用 [自选]"
    type: select
    proxies: ["♻️ 自动选择 [系统]", "🇺🇸 美国节点 [系统]", "🇲🇾 马来西亚节点 [系统]", "🇭🇰 香港节点 [系统]", "🇯🇵 日本节点 [系统]", "🇸🇬 新加坡节点 [系统]", "🇩🇪 德国节点 [系统]", "🌍 其他地区 [系统]", "🌐 全部节点 [系统]", "直连(DIRECT)"]
  - name: "Ⓜ️ 微软服务 [自选]"
    type: select
    proxies: ["♻️ 自动选择 [系统]", "🇺🇸 美国节点 [系统]", "🇲🇾 马来西亚节点 [系统]", "🇭🇰 香港节点 [系统]", "🇯🇵 日本节点 [系统]", "🇸🇬 新加坡节点 [系统]", "🇩🇪 德国节点 [系统]", "🌍 其他地区 [系统]", "🌐 全部节点 [系统]", "直连(DIRECT)"]
  - name: "🍎 苹果服务 [自选]"
    type: select
    proxies: ["♻️ 自动选择 [系统]", "🇺🇸 美国节点 [系统]", "🇲🇾 马来西亚节点 [系统]", "🇭🇰 香港节点 [系统]", "🇯🇵 日本节点 [系统]", "🇸🇬 新加坡节点 [系统]", "🇩🇪 德国节点 [系统]", "🌍 其他地区 [系统]", "🌐 全部节点 [系统]", "直连(DIRECT)"]
  - name: "💰 币圈专用 [自选]"
    type: select
    proxies: ["♻️ 自动选择 [系统]", "🇺🇸 美国节点 [系统]", "🇲🇾 马来西亚节点 [系统]", "🇭🇰 香港节点 [系统]", "🇯🇵 日本节点 [系统]", "🇸🇬 新加坡节点 [系统]", "🇩🇪 德国节点 [系统]", "🌍 其他地区 [系统]", "🌐 全部节点 [系统]", "直连(DIRECT)"]
  - name: "🖥️ 软件分流 [自选]"
    type: select
    proxies: ["🚀 默认代理 [自选]", "♻️ 自动选择 [系统]", "🇺🇸 美国节点 [系统]", "🇲🇾 马来西亚节点 [系统]", "🇭🇰 香港节点 [系统]", "🇯🇵 日本节点 [系统]", "🇸🇬 新加坡节点 [系统]", "🇩🇪 德国节点 [系统]", "🌍 其他地区 [系统]", "🌐 全部节点 [系统]", "直连(DIRECT)"]

  # ---------- 中文别名 ----------
  - name: "直连(DIRECT)"
    type: select
    hidden: true
    proxies: [DIRECT]
  - name: "禁止广告(REJECT)"
    type: select
    hidden: true
    proxies: [REJECT]

  # ---------- 系统组 ----------
  - name: "🌐 全部节点 [系统]"
    type: select
    include-all-proxies: true
    exclude-type: Direct
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website"
  - name: "♻️ 自动选择 [系统]"
    type: url-test
    include-all-proxies: true
    exclude-type: Direct
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website"
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  # ---------- 地区节点 ----------
  - name: "🇺🇸 美国节点 [系统]"
    type: url-test
    include-all-proxies: true
    filter: "(?i)🇺🇸|美国|美利坚|United[ -]?States|America|Los[ -]?Angeles|San[ -]?Jose|Seattle|Dallas|New[ -]?York|San[ -]?Francisco|\\bUS\\b|\\bUSA\\b"
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website"
    exclude-type: Direct
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: "🇲🇾 马来西亚节点 [系统]"
    type: url-test
    include-all-proxies: true
    filter: "(?i)🇲🇾|马来西亚|馬來西亞|Malaysia|Kuala[ -]?Lumpur|\\bMY\\b|\\bMYS\\b"
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website"
    exclude-type: Direct
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: "🇭🇰 香港节点 [系统]"
    type: url-test
    include-all-proxies: true
    filter: "(?i)🇭🇰|香港|Hong[ -]?Kong|\\bHK\\b|\\bHKG\\b"
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website"
    exclude-type: Direct
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: "🇯🇵 日本节点 [系统]"
    type: url-test
    include-all-proxies: true
    filter: "(?i)🇯🇵|日本|Japan|Tokyo|Osaka|\\bJP\\b|\\bJPN\\b"
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website"
    exclude-type: Direct
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: "🇸🇬 新加坡节点 [系统]"
    type: url-test
    include-all-proxies: true
    filter: "(?i)🇸🇬|新加坡|新国|Singapore|\\bSG\\b|\\bSGP\\b"
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website"
    exclude-type: Direct
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: "🇩🇪 德国节点 [系统]"
    type: url-test
    include-all-proxies: true
    filter: "(?i)🇩🇪|德国|德國|Germany|Frankfurt|Berlin|\\bDE\\b|\\bDEU\\b"
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website"
    exclude-type: Direct
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  # ---------- 其他地区 ----------
  - name: "🌍 其他地区 [系统]"
    type: select
    include-all-proxies: true
    filter: "(?i)^(?!.*(?:🇺🇸|🇲🇾|🇭🇰|🇯🇵|🇸🇬|🇩🇪|美国|美利坚|United[ -]?States|America|Los[ -]?Angeles|San[ -]?Jose|Seattle|Dallas|New[ -]?York|San[ -]?Francisco|马来西亚|馬來西亞|Malaysia|Kuala[ -]?Lumpur|香港|Hong[ -]?Kong|日本|Japan|Tokyo|Osaka|新加坡|新国|Singapore|德国|德國|Germany|Frankfurt|Berlin|\\bUS\\b|\\bUSA\\b|\\bMY\\b|\\bMYS\\b|\\bHK\\b|\\bHKG\\b|\\bJP\\b|\\bJPN\\b|\\bSG\\b|\\bSGP\\b|\\bDE\\b|\\bDEU\\b)).*"
    exclude-filter: "(?i)官网|官方|流量|剩余|到期|过期|套餐|订阅|重置|traffic|remaining|expire|expiry|expires|quota|bandwidth|subscription|reset|official|website"
    exclude-type: Direct

  # ---------- 广告拦截 ----------
  - name: "🛑 广告拦截 [系统]"
    type: select
    proxies: ["禁止广告(REJECT)", "直连(DIRECT)"]

