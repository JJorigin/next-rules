proxy-groups:
  # ---------- 用户默认组 ----------
  # 未命中特定规则的请求默认使用代理；自动选择和当前订阅中的有效节点可手动选择。
  - name: "🚀 默认代理 [自选]"
    type: select
    proxies: ["♻️ 自动选择 [系统]"]
    include-all-proxies: true
    exclude-type: Direct
    exclude-filter: "(?i)(?:^|[|｜])[^A-Za-z0-9\\u3400-\\u9FFF]*(?:官网(?:地址|网址)?|官方(?:网站|网址|频道|群组|交流群)?|流量(?:剩余|已用|总量|重置)?|剩余(?:流量)?|可用流量|已用流量|总流量|到期(?:时间|日期)?|过期(?:时间|日期)?|有效期|套餐(?:信息|名称|到期)?|订阅(?:信息|地址|链接|更新)?|(?:下次)?重置(?:时间|日期)?|traffic|remaining(?:[ _-]+traffic)?|expire[sd]?|expiry|quota|bandwidth|subscription|reset|official(?:[ _-]+(?:website|site|channel))?|website)(?=$|[\\s:：=|｜0-9-])|^DIRECT$"

  # ---------- 用户场景组 ----------
  # 各场景可独立选择自动选择、DIRECT（直连）或当前订阅中的节点。
  # include-all-proxies 不包含其他策略组；场景组保留 Mihomo 内置的 DIRECT。
